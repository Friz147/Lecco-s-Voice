<!--
  ============================================================================
  LECCO'S VOICE — Mobile-first web app
  ============================================================================
  Single-file build (HTML + CSS + JS). Mobile-first, max-width 390px.

  STRUTTURA DEL CODICE (modulare, pronta per un backend):
    0. ASSETS ............ immagini (logo, sfondo hero, foto) base64
    1. CONFIG ............ impostazioni: bounding box mappa, limiti zoom
    2. I18N .............. tutte le stringhe UI in IT / EN
    3. CATEGORIES ........ categorie + colori + icone (carota, mucca, ...)
    4. PLACES ............ dati dei luoghi  ← SOSTITUISCI con i tuoi dati / API
    5. MapEngine ......... mappa grafica (SVG illustrato della provincia di
                           Lecco) + proiezione lat/lng dei pin + zoom/pan.
                           Per il backend basta cambiare PLACES.
    6. UI / RENDER ....... render delle pagine e degli overlay (bottom sheet)
    7. EVENTS ............ navigazione, filtri, lingua, form

  MAPPA:
    Mappa grafica illustrata (nessuna libreria esterna, nessuna API key).
    Copre l'area della provincia di Lecco. I pin sono posizionati proiettando
    lat/lng sul box CONFIG.BOUNDS. Zoom +/- e trascinamento per il pan.

  FONT:
    Un solo font (Fraunces) via le variabili --font-display / --font-body.
    Per i font custom basta cambiare quelle due variabili.
  ============================================================================
-->
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Lecco's Voice</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,500;1,9..144,600;1,9..144,900&display=swap" rel="stylesheet">

</head>
<body>
<div id="app">

  <!-- ============ HEADER ============ -->
  <header class="header">
    <div class="brand">
      <span class="brand-logo"><img id="brandLogo" src="Logo.png" alt="Lecco's Voice"></span>
      <span class="brand-name">Welcome!</span>
    </div>
    <nav class="nav">
      <button data-page="map" class="active" data-i18n="nav.map">MAP</button>
      <button data-page="info" data-i18n="nav.info">INFO</button>
    </nav>
    <button class="lang" id="langToggle" aria-label="Language">
      <span data-lang="it" class="on">IT</span>
      <span class="sep">/</span>
      <span data-lang="en">EN</span>
    </button>
  </header>

  <!-- ============ SCROLL AREA ============ -->
  <div class="scroll" id="scroll">

    <!-- ---------- PAGE: MAP ---------- -->
    <section class="page active" id="page-map">

      <!-- HERO -->
      <div class="hero">
        <div class="hero-bg" id="heroBg"></div>
        <h1>Lecco's<br>Voice</h1>
        <p data-i18n="hero.sub"></p>
      </div>

      <h2 class="section-title" data-i18n="map.question"></h2>

      <!-- MAP -->
      <div class="map-wrap">
        <div class="map-frame" id="mapFrame">
          <!-- mappa grafica della provincia di Lecco (pin + mappa scalano insieme) -->
          <div id="mapStage">
            <img id="mapImg" alt="Mappa di Lecco">
            <div class="fb-watermark">Lecco's Voice</div>
            <div id="pinLayer" style="position:absolute;inset:0;z-index:5;pointer-events:none;"></div>
          </div>

          <!-- filter rail -->
          <div class="rail">
            <button class="rail-add" id="railAdd" aria-label="Aggiungi luogo">+</button>
            <div class="rail-list" id="railList"></div>
          </div>

          <!-- zoom -->
          <div class="zoom">
            <button id="zoomIn">+</button>
            <button id="zoomOut">&minus;</button>
          </div>
        </div>

        <!-- legend -->
        <div class="legend" id="legend"></div>
      </div>

      <!-- TRUST -->
      <div class="trust">
        <h3 data-i18n="trust.title"></h3>
        <p data-i18n="trust.text"></p>
        <button id="trustCta" class="btn-ghost" data-i18n="trust.cta"></button>
      </div>

      <!-- FOOTER -->
      <footer class="footer">
        <span class="brand-logo"><img class="footLogo" alt="Lecco's Voice" src="images/Logo.png"></span>
        <div class="footer-social">
          <button>Facebook</button><button>Instagram</button><button>Twitter</button>
        </div>
      </footer>
    </section>

    <!-- ---------- PAGE: INFO ---------- -->
    <section class="page" id="page-info">
      <div class="info-page">
        <h2 data-i18n="info.title"></h2>
        <div class="info-body">
          <p data-i18n="info.p1"></p>
          <p data-i18n="info.p2"></p>
        </div>

        <div class="photos">
          <div class="polaroid"><div class="ph"><img class="infoPhoto" data-photo="1" alt=""></div></div>
          <div class="polaroid"><div class="ph"><img class="infoPhoto" data-photo="2" alt=""></div></div>
        </div>

        <!-- CONTACT FORM -->
        <div class="form-block">
          <div class="fb-title" data-i18n="contact.title"></div>
          <div class="fb-sub" data-i18n="contact.sub"></div>
          <div class="field">
            <label data-i18n="contact.name"></label>
            <input type="text" id="ctName" data-i18n-ph="contact.namePh">
          </div>
          <div class="field">
            <label data-i18n="contact.email"></label>
            <input type="email" id="ctEmail" data-i18n-ph="contact.emailPh">
          </div>
          <div class="field">
            <label data-i18n="contact.msg"></label>
            <textarea id="ctMsg" rows="4" data-i18n-ph="contact.msgPh"></textarea>
          </div>
          <button class="btn-primary" id="ctSend" data-i18n="contact.send"></button>
        </div>
      </div>

      <footer class="footer">
        <span class="brand-logo"><img class="footLogo" alt="Lecco's Voice" src=""></span>
        <div class="footer-social">
          <button>Facebook</button><button>Instagram</button><button>Twitter</button>
        </div>
      </footer>
    </section>

  </div><!-- /scroll -->

  <!-- ============ OVERLAYS ============ -->
  <div class="scrim" id="scrim"></div>

  <!-- SHEET: pin info window -->
  <div class="sheet" id="sheetInfo">
    <button class="sheet-close" data-close>&times;</button>
    <div class="sheet-grab"></div>
    <div class="sheet-body" id="infoBody"></div>
  </div>

  <!-- SHEET: add place ("La tua voce conta") -->
  <div class="sheet" id="sheetAdd">
    <button class="sheet-close" data-close>&times;</button>
    <div class="sheet-grab"></div>
    <div class="sheet-body">
      <div class="form-block" style="margin-top:8px">
        <div class="fb-title" data-i18n="add.title"></div>
        <div class="fb-sub" data-i18n="add.sub"></div>
        <div class="field">
          <label data-i18n="add.name"></label>
          <input type="text" id="apName" data-i18n-ph="add.namePh">
        </div>
        <div class="field">
          <label data-i18n="add.cat"></label>
          <select id="apCat"></select>
        </div>
        <div class="field">
          <label data-i18n="add.addr"></label>
          <input type="text" id="apAddr" data-i18n-ph="add.addrPh">
        </div>
        <div class="field">
          <label data-i18n="add.photo"></label>
          <div class="upload"><span class="cam">📷</span><span data-i18n="add.photoCta"></span></div>
        </div>
        <button class="btn-primary" id="apSend" data-i18n="add.send"></button>
      </div>
    </div>
  </div>

  <!-- SHEET: review form ("La tua voce conta" / recensione) -->
  <div class="sheet" id="sheetReview">
    <button class="sheet-close" data-close>&times;</button>
    <div class="sheet-grab"></div>
    <div class="sheet-body">
      <div class="form-block" style="margin-top:8px">
        <div class="fb-title" data-i18n="rev.title"></div>
        <div class="fb-sub" data-i18n="rev.sub"></div>
        <div class="field">
          <label data-i18n="rev.name"></label>
          <input type="text" id="rvName" data-i18n-ph="rev.namePh">
        </div>
        <div class="field">
          <label data-i18n="rev.rating"></label>
          <div class="stars" id="rvStars"></div>
        </div>
        <div class="field">
          <label data-i18n="rev.liked"></label>
          <textarea id="rvLiked" rows="3" data-i18n-ph="rev.likedPh"></textarea>
        </div>
        <div class="field">
          <label data-i18n="rev.improve"></label>
          <textarea id="rvImprove" rows="3" data-i18n-ph="rev.improvePh"></textarea>
        </div>
        <div class="field">
          <label data-i18n="rev.photo"></label>
          <div class="upload"><span class="cam">📷</span><span data-i18n="rev.photoCta"></span></div>
        </div>
        <button class="btn-primary" id="rvSend" data-i18n="rev.send"></button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>
<script src="script.js"></script>
</body>
</html>
